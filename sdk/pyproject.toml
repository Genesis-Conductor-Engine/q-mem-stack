[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-thermal-bridge"
version = "0.1.0"
description = "Python SDK skeleton for the Genesis Thermal Bridge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["genesis_thermal_bridge*"]
