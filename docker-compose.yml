version: '3.8'

services:
  llm-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-cuda
    container_name: genesis-llm-phi2
    runtime: nvidia
    ports:
      - "8082:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    entrypoint: ["/llama.cpp/llama-server"]
    command: ["-m", "/models/phi-2.Q4_K_M.gguf", "-c", "2048", "-ngl", "33", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  q-mem-cache:
    image: redis/redis-stack-server:latest
    container_name: genesis-q-mem
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--maxmemory 1500mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  gpu-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: q-mem-sync
    network_mode: host
    depends_on:
      - llm-server
      - q-mem-cache
    environment:
      - LLM_HOST=localhost
      - LLM_PORT=8082
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
    restart: unless-stopped

  genesis-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-gateway
    ports:
      - "5000:5000"
    depends_on:
      - q-mem-cache
    environment:
      - REDIS_HOST=q-mem-cache
      - REDIS_PORT=6379
      - PORT=5000
    command: ["python", "-u", "agent_gateway.py"]
    restart: unless-stopped

volumes:
  redis-data:
